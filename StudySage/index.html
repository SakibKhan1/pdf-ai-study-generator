<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudySage - PDF Summarizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f4f4f4;
    }
    #summary {
      white-space: pre-wrap;
      background: white;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>📄 StudySage PDF Summarizer</h1>
  <input type="file" id="pdfInput" accept="application/pdf" />
  <button onclick="uploadPDF()">Summarize PDF</button>

  <div id="summary"></div>

  <script>
    async function uploadPDF() {
      const input = document.getElementById('pdfInput');
      if (!input.files.length) return alert('Please select a PDF file');

      const formData = new FormData();
      formData.append('pdf', input.files[0]);

      document.getElementById('summary').innerText = 'Loading summary...';

      try {
        const res = await fetch('http://localhost:5000/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.summary) {
          document.getElementById('summary').innerText = data.summary;
        } else {
          document.getElementById('summary').innerText = 'Error: ' + data.error;
        }
      } catch (err) {
        document.getElementById('summary').innerText = 'Request failed: ' + err.message;
      }
    }
  </script>
</body>
</html>
