<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudySage - PDF Summarizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>📄 StudySage PDF Summarizer</h1>

    <div class="upload-section">
      <input type="file" id="pdfInput" accept="application/pdf" />
      <button onclick="uploadPDF()">Summarize PDF</button>
    </div>

    <div id="summary" class="output-box"></div>

    <div class="actions">
      <button id="flashcardBtn" style="display:none;" onclick="generateFlashcards()">🧠 Generate Flashcards</button>
      <button id="quizBtn" style="display:none;" onclick="generateQuiz()">📝 Generate Quiz</button>
    </div>
    <div id="flashcards" class="output-box" style="display: none;">
      <span class="close-btn" onclick="closeBox('flashcards')">✖</span>
      <div id="flashcardsContent"></div>
    </div>

    <div id="quiz" class="output-box" style="display: none;">
      <span class="close-btn" onclick="closeBox('quiz')">✖</span>
      <div id="quizContent"></div>
    </div>

    <div id="usageCount" class="usage-message"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
